name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Test
        run: uv run --python ${{ matrix.python-version }} --extra test pytest

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} --extra dev ruff check tests scripts

      - name: Build
        run: uv run --python ${{ matrix.python-version }} --extra dev python -m build

      - name: Check artifacts
        run: uv run --python ${{ matrix.python-version }} --extra dev twine check dist/*
