[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiand"
version = "0.1.0"
description = "Python SDK for the ai& API, generated from the public OpenAPI spec."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ai&" }]
keywords = ["aiand", "ai&", "openai-compatible", "openapi", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.11",
  "python-dateutil>=2.8.2",
  "typing-extensions>=4.7.1",
  "urllib3>=2.1.0,<3.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "PyYAML>=6.0",
  "vcrpy>=6.0",
]
dev = [
  "build>=1.2.1",
  "ruff>=0.6.0",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://docs.aiand.com"
Documentation = "https://docs.aiand.com"
OpenAPI = "https://api.aiand.com/openapi.json"
Repository = "https://github.com/aiandlabs/aiand-python"

[tool.setuptools.packages.find]
include = ["aiand*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "aiand",
  "docs",
  "setup.py",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
